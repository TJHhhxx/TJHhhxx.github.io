<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1对1在线聊天</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            color: #fff;
            min-height: 100vh;
            background: linear-gradient(135deg, #2c3e50 0%, #4a148c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 80vh;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h2 {
            color: #ff9ecc;
            font-size: 1.4rem;
        }
        .online-status {
            font-size: 0.9rem;
            color: #4ade80;
        }
        .offline-status {
            color: #f87171;
        }
        .chat-room-area {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .room-link-box {
            display: flex;
            gap: 10px;
        }
        .room-link-input {
            flex: 1;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
        }
        .copy-link-btn {
            padding: 0 15px;
            background: #ff69b4;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
        }
        .chat-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 20px;
        }
        .message.self {
            background: rgba(255,105,180,0.3);
            align-self: flex-end;
        }
        .message.other {
            background: rgba(255,255,255,0.1);
            align-self: flex-start;
        }
        .message.system {
            background: rgba(66,153,225,0.2);
            align-self: center;
            font-size: 0.85rem;
            padding: 8px 15px;
        }
        .chat-input-area {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 12px;
        }
        .chat-input {
            flex: 1;
            padding: 12px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            color: #fff;
            outline: none;
        }
        .chat-send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ff69b4;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2>1对1在线聊天</h2>
        <span class="online-status" id="onlineStatus">🟢 在线</span>
    </div>

    <div class="chat-room-area">
        <p>分享链接即可一对一聊天：</p>
        <div class="room-link-box">
            <input type="text" class="room-link-input" id="roomLink" readonly>
            <button class="copy-link-btn" id="copyBtn">复制</button>
        </div>
    </div>

    <div class="chat-content" id="msgBox"></div>

    <div class="chat-input-area">
        <input type="text" class="chat-input" id="inputMsg" placeholder="输入消息...">
        <button class="chat-send-btn" id="sendBtn">发送</button>
    </div>
</div>

<!-- 已嵌入你的 Tawk.to 一对一聊天脚本 -->
<!--Start of Tawk.to Script-->
<script type="text/javascript">
var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
(function(){
var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
s1.async=true;
s1.src='https://embed.tawk.to/69dccc44b7ecbc1c3115f0fa/1jm37rrn2';
s1.charset='UTF-8';
s1.setAttribute('crossorigin','*');
s0.parentNode.insertBefore(s1,s0);
})();
</script>
<!--End of Tawk.to Script-->

<script>
// 生成房间链接
let room = new URLSearchParams(location.search).get('room') || 'chat_'+Date.now();
document.getElementById('roomLink').value = location.origin + location.pathname + '?room='+room;

// 复制链接
document.getElementById('copyBtn').onclick = ()=>{
    navigator.clipboard.writeText(document.getElementById('roomLink').value);
    document.getElementById('copyBtn').innerText = '已复制';
    setTimeout(()=>document.getElementById('copyBtn').innerText='复制',1500);
};

// 发送消息
function send(){
    let txt = document.getElementById('inputMsg').value.trim();
    if(!txt) return;
    let div = document.createElement('div');
    div.className = 'message self';
    div.innerText = txt;
    document.getElementById('msgBox').appendChild(div);
    document.getElementById('inputMsg').value = '';
    document.getElementById('msgBox').scrollTop = 99999;
}
document.getElementById('sendBtn').onclick = send;
document.getElementById('inputMsg').onkeydown = e=>e.key=='Enter'&&send();
</script>

</body>
</html>
